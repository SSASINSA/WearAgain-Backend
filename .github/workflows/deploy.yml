name: 빌드 및 배포 (GHCR + Compose)

on:
  push:
    branches: [ "develop" ]     # develop 푸시 시 자동 실행
  workflow_dispatch:            # 수동 실행 버튼


permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ssasinsa/wearagain-backend

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }} 
          
      - name: Build & Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Login to GHCR (runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Ensure deploy dir
        run: |
          mkdir -p /opt/wearagain

      - name: Write .env from secret (0600)
        working-directory: /opt/wearagain
        run: |
          umask 077
          printf '%s' "${{ secrets.ENV }}" > .env

      - name: Up with Compose (pull latest & recreate)
        working-directory: /opt/wearagain
        run: |
          docker compose up -d --pull always --force-recreate
          docker image prune -f
