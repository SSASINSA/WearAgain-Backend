# .github/workflows/deploy.yml
name: "빌드 및 배포 (GHCR + Compose)"

on:
  # push:
  #   branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      ref:
        description: "빌드/배포할 브랜치 또는 태그 (예: feature/foo, develop, v1.0.0)"
        required: true
        default: "develop"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/seungsang/wearagain-backend

concurrency:
  group: deploy-${{ github.ref_name || inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Login to GHCR (runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Ensure deploy dir
        run: sudo mkdir -p /opt/wearagain && sudo chown $USER:$USER /opt/wearagain

      - name: Write .env from secret (0600)
        working-directory: /opt/wearagain
        run: |
          umask 077
          printf '%s' "${{ secrets.ENV }}" > .env

      - name: Pull & Up (Compose)
        working-directory: /opt/wearagain
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f
