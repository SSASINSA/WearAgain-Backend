<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WearAgain Kakao Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f8fafc; }
        main { max-width: 360px; margin: 80px auto; padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1); text-align: center; }
        h1 { font-size: 20px; margin-bottom: 12px; color: #111827; }
        p { margin: 0; color: #475569; font-size: 14px; line-height: 1.5; }
        .spinner { width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top-color: #0f172a; border-radius: 50%; margin: 24px auto; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<main>
    <div class="spinner"></div>
    <h1>카카오 로그인 준비 중</h1>
    <p id="status">잠시만 기다려 주세요...</p>
</main>
<script>
    const statusEl = document.getElementById('status');

    function setStatus(message) {
        statusEl.textContent = message;
    }

    function createState() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            return window.crypto.randomUUID();
        }
        return 'state-' + Math.random().toString(36).substring(2, 12);
    }

    function redirectToKakao(url) {
        try {
            const target = new URL(url);
            const state = createState();
            sessionStorage.setItem('swagger-kakao-state', state);
            target.searchParams.set('state', state);
            window.location.href = target.toString();
        } catch (error) {
            console.error('인가 URL 파싱 실패', error);
            setStatus('인가 URL을 분석하지 못했습니다. 창을 닫고 다시 시도해 주세요.');
        }
    }

    fetch('/api/v1/auth/kakao/authorize-url', { credentials: 'same-origin' })
        .then(function (response) {
            if (!response.ok) {
                throw new Error('인가 URL을 불러오지 못했습니다. (' + response.status + ')');
            }
            return response.json();
        })
        .then(function (data) {
            if (!data || !data.authorizationUrl) {
                throw new Error('인가 URL이 비어 있습니다.');
            }
            setStatus('카카오 로그인 페이지로 이동합니다...');
            redirectToKakao(data.authorizationUrl);
        })
        .catch(function (error) {
            console.error('인가 URL 조회 실패', error);
            setStatus('인가 URL을 불러오는 중 오류가 발생했습니다. 창을 닫고 다시 시도해 주세요.');
            if (window.opener) {
                window.opener.postMessage({ type: 'SWAGGER_KAKAO_LOGIN_ERROR', message: error.message }, window.location.origin);
            }
        });
</script>
</body>
</html>
