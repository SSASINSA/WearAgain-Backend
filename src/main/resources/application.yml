server:
  forward-headers-strategy: native

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]
  application:
    name: wearagain
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/wearagain?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${MYSQL_USERNAME:wearagain}
    password: ${MYSQL_PASSWORD:wearagain}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: ${HIBERNATE_SLOW_QUERY_MS:0}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  servlet:
    multipart:
      location: ${EVENT_IMAGE_UPLOAD_ROOT:/data/uploads}
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
            scope:
              - email
              - profile
#          kakao:
#            client-id: ${OAUTH_KAKAO_CLIENT_ID:}
#            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
#            client-authentication-method: client_secret_post
#            authorization-grant-type: authorization_code
#            redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
#            scope:
#              - profile_nickname
#              - account_email
#          apple:
#            client-id: ${OAUTH_APPLE_CLIENT_ID:}
#            team-id: ${OAUTH_APPLE_TEAM_ID:}
#            key-id: ${OAUTH_APPLE_KEY_ID:}
#            private-key: ${OAUTH_APPLE_PRIVATE_KEY:}
#        provider:
#          kakao:
#            authorization-uri: https://kauth.kakao.com/oauth/authorize
#            token-uri: https://kauth.kakao.com/oauth/token
#            user-info-uri: https://kapi.kakao.com/v2/user/me
#            user-name-attribute: id
#          apple:
#            authorization-uri: https://appleid.apple.com/auth/authorize
#            token-uri: https://appleid.apple.com/auth/token
#            jwk-set-uri: https://appleid.apple.com/auth/keys
#            user-name-attribute: sub

jwt:
  issuer: ${JWT_ISSUER:wearagain}
  access-token:
    secret: ${JWT_ACCESS_TOKEN_SECRET:change-me-please}
    validity: ${JWT_ACCESS_TOKEN_VALIDITY:900000}
  refresh-token:
    secret: ${JWT_REFRESH_TOKEN_SECRET:change-me-too}
    validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}

auth:
  redis:
    refresh-token-prefix: ${AUTH_REDIS_REFRESH_TOKEN_PREFIX:auth:refresh-token}
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
    app-client-id: ${OAUTH_KAKAO_APP_CLIENT_ID:}
    redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    issuer: https://kauth.kakao.com
    key-uri: https://kauth.kakao.com/.well-known/jwks.json
  apple:
    client-id: ${OAUTH_APPLE_CLIENT_ID:}
    team-id: ${OAUTH_APPLE_TEAM_ID:}
    key-id: ${OAUTH_APPLE_KEY_ID:}
    private-key: ${OAUTH_APPLE_PRIVATE_KEY:}
    redirect-uri: ${OAUTH_APPLE_REDIRECT_URI:https://ssasinsa.co.kr/api/v1/auth/apple/callback}
    token-uri: https://appleid.apple.com/auth/token
    key-uri: https://appleid.apple.com/auth/keys

report:
  storage:
    output-dir: ${REPORT_OUTPUT_DIR:/data/report}
    base-url: ${REPORT_BASE_URL:http://localhost:8080/reports}

admin:
  jwt:
    issuer: ${ADMIN_JWT_ISSUER:wearagain-admin}
    access-token:
      secret: ${ADMIN_JWT_ACCESS_TOKEN_SECRET:change-me-admin-secret-key-32-bytes}
      validity: ${ADMIN_JWT_ACCESS_TOKEN_VALIDITY:1800000}
    refresh-token:
      secret: ${ADMIN_JWT_REFRESH_TOKEN_SECRET:change-me-admin-refresh-secret-key-64-bytes}
      validity: ${ADMIN_JWT_REFRESH_TOKEN_VALIDITY:604800000}
  super:
    email: ${ADMIN_SUPER_EMAIL:}
    password: ${ADMIN_SUPER_PASSWORD:}
    name: ${ADMIN_SUPER_NAME:Super Admin}
logging:
  level:
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_ORG_HIBERNATE_BIND:INFO}

impact:
  co2-per-ticket: ${IMPACT_CO2_PER_TICKET:0}
  water-per-ticket: ${IMPACT_WATER_PER_TICKET:0}
  energy-per-ticket: ${IMPACT_ENERGY_PER_TICKET:0}

app:
  upload:
    event-image-root: ${EVENT_IMAGE_UPLOAD_ROOT:/data/uploads}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

swagger:
  test-login:
    admin:
      email: ${SWAGGER_TEST_LOGIN_ADMIN_EMAIL:}
      password: ${SWAGGER_TEST_LOGIN_ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
